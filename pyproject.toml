[project]
name = "project-name"
version = "0.1.0"
description = "One-line description of the business problem this project solves."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enock Mulenga" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W pycodestyle (PEP 8), F pyflakes, I isort, B bugbear, UP pyupgrade,
# N naming, SIM simplify, D docstrings (Google style).
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D100", "D104"]  # module/package docstrings optional

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: slower tests that touch databases, APIs or files"]
